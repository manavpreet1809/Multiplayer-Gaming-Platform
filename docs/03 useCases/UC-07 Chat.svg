<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="620" height="420" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary -->
  <rect x="260" y="30" width="300" height="360" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="260" y1="80" x2="560" y2="80" stroke="#2c2e33" stroke-width="2"/>
  <text x="370" y="63" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Platform</text>

  <!-- UC-07: Chat -->
  <ellipse cx="410" cy="150" rx="100" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="410" y="155" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-07: Chat</text>

  <!-- Send Message -->
  <ellipse cx="350" cy="265" rx="80" ry="32" fill="#aba3ff" stroke="transparent"/>
  <text x="350" y="260" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Send</text>
  <text x="350" y="278" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Message</text>

  <!-- Receive Messages -->
  <ellipse cx="480" cy="265" rx="75" ry="32" fill="#aba3ff" stroke="transparent"/>
  <text x="480" y="260" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Receive</text>
  <text x="480" y="278" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Messages</text>

  <!-- Actor: Authenticated Player -->
  <ellipse cx="100" cy="135" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="201" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="159" x2="140" y2="159" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="240" x2="100" y2="201" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="240" x2="100" y2="201" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="265" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Authenticated</text>
  <text x="100" y="283" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Player</text>

  <!-- Player -> Chat -->
  <line x1="140" y1="155" x2="310" y2="152" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- include: Chat to Send Message -->
  <line x1="380" y1="190" x2="358" y2="233" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="310" y="215" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- include: Chat to Receive Messages -->
  <line x1="440" y1="190" x2="468" y2="233" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="470" y="215" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

</svg>
