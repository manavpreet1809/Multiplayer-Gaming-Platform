<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="620" height="380" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary -->
  <rect x="250" y="30" width="310" height="320" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="250" y1="80" x2="560" y2="80" stroke="#2c2e33" stroke-width="2"/>
  <text x="345" y="63" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Platform</text>

  <!-- UC-01: View Game List -->
  <ellipse cx="405" cy="160" rx="110" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="405" y="155" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-01: View</text>
  <text x="405" y="173" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Game List</text>

  <!-- View Game Details -->
  <ellipse cx="405" cy="275" rx="100" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="405" y="270" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">View Game</text>
  <text x="405" y="288" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Details</text>

  <!-- Actor: User -->
  <ellipse cx="100" cy="145" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="160" x2="100" y2="211" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="169" x2="140" y2="169" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="250" x2="100" y2="211" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="250" x2="100" y2="211" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="275" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">User</text>

  <!-- User -> View Game List -->
  <line x1="140" y1="170" x2="295" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- extend: View Game List to View Game Details -->
  <line x1="405" y1="202" x2="405" y2="237" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="420" y="225" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

</svg>
