<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="620" height="420" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary -->
  <rect x="250" y="30" width="310" height="360" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="250" y1="80" x2="560" y2="80" stroke="#2c2e33" stroke-width="2"/>
  <text x="365" y="63" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Platform</text>

  <!-- UC-03: Log In -->
  <ellipse cx="405" cy="145" rx="100" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="405" y="150" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-03: Log In</text>

  <!-- Validate Credentials -->
  <ellipse cx="350" cy="260" rx="90" ry="35" fill="#aba3ff" stroke="transparent"/>
  <text x="350" y="255" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Validate</text>
  <text x="350" y="273" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Credentials</text>

  <!-- View Dashboard (UC-04) -->
  <ellipse cx="470" cy="350" rx="80" ry="30" fill="#aba3ff" stroke="transparent"/>
  <text x="470" y="345" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">View Dashboard</text>
  <text x="470" y="363" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">(UC-04)</text>

  <!-- Actor: User -->
  <ellipse cx="100" cy="130" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="145" x2="100" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="154" x2="140" y2="154" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="235" x2="100" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="235" x2="100" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="260" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">User</text>

  <!-- User -> Log In -->
  <line x1="140" y1="155" x2="305" y2="148" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- include: Log In to Validate Credentials -->
  <line x1="380" y1="185" x2="360" y2="225" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="305" y="210" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- include: Log In to View Dashboard -->
  <line x1="430" y1="185" x2="455" y2="320" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="460" y="270" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

</svg>
