<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="650" height="450" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary -->
  <rect x="250" y="30" width="340" height="390" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="250" y1="80" x2="590" y2="80" stroke="#2c2e33" stroke-width="2"/>
  <text x="370" y="63" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Platform</text>

  <!-- UC-02: Create Account -->
  <ellipse cx="420" cy="145" rx="110" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="420" y="140" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-02: Create</text>
  <text x="420" y="158" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Account</text>

  <!-- Validate Input -->
  <ellipse cx="350" cy="260" rx="85" ry="35" fill="#aba3ff" stroke="transparent"/>
  <text x="350" y="255" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Validate</text>
  <text x="350" y="273" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Input</text>

  <!-- Store Account -->
  <ellipse cx="500" cy="260" rx="80" ry="35" fill="#aba3ff" stroke="transparent"/>
  <text x="500" y="255" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Store</text>
  <text x="500" y="273" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Account</text>

  <!-- Auto-Login -->
  <ellipse cx="420" cy="365" rx="90" ry="35" fill="#aba3ff" stroke="transparent"/>
  <text x="420" y="360" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Auto-Login</text>
  <text x="420" y="378" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">(UC-03 / UC-04)</text>

  <!-- Actor: User -->
  <ellipse cx="100" cy="130" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="145" x2="100" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="154" x2="140" y2="154" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="235" x2="100" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="235" x2="100" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="260" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">User</text>

  <!-- User -> Create Account -->
  <line x1="140" y1="160" x2="310" y2="148" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- include: Create Account to Validate Input -->
  <line x1="385" y1="185" x2="360" y2="225" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="300" y="210" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- include: Create Account to Store Account -->
  <line x1="455" y1="185" x2="485" y2="225" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="490" y="210" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- extend: Create Account to Auto-Login -->
  <line x1="420" y1="187" x2="420" y2="330" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="435" y="310" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

</svg>
