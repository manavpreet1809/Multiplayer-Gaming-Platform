@startuml
title UC-05: Join Game Lobby (Updated)\nUC-3: Added Lobby Capacity Validation
skinparam backgroundColor white

left to right direction
skinparam packageStyle rectangle

actor "Authenticated\nPlayer" as Player

rectangle "Platform" {
  usecase "UC-05: Join\nGame Lobby" as UC05
  usecase "Select / Create\nLobby" as SL
  usecase "Validate Lobby\nCapacity" as VLC
  usecase "Chat (UC-07)" as UC07
}

Player - -> UC05
UC05 ..> SL : <<include>>
UC05 ..> VLC : <<include>>
UC05 ..> UC07 : <<extend>>

note right of VLC
  **NEW (UC-3)**
  - Max players per lobby
  - Max lobbies per game type
  - Idle lobby cleanup
end note

@enduml

