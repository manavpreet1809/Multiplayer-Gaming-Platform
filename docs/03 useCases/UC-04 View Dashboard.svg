<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="680" height="560" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary -->
  <rect x="260" y="30" width="350" height="500" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="260" y1="80" x2="610" y2="80" stroke="#2c2e33" stroke-width="2"/>
  <text x="390" y="63" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Platform</text>

  <!-- UC-04: View Dashboard (centre, main) -->
  <ellipse cx="435" cy="145" rx="115" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="435" y="140" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-04: View</text>
  <text x="435" y="158" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Dashboard</text>

  <!-- Browse Games (UC-01) -->
  <ellipse cx="345" cy="250" rx="75" ry="30" fill="#aba3ff" stroke="transparent"/>
  <text x="345" y="246" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">Browse Games</text>
  <text x="345" y="262" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">(UC-01)</text>

  <!-- Join Lobby (UC-05) -->
  <ellipse cx="530" cy="250" rx="75" ry="30" fill="#aba3ff" stroke="transparent"/>
  <text x="530" y="246" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">Join Lobby</text>
  <text x="530" y="262" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">(UC-05)</text>

  <!-- Enqueue (UC-06) -->
  <ellipse cx="345" cy="340" rx="75" ry="30" fill="#aba3ff" stroke="transparent"/>
  <text x="345" y="336" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">Enqueue</text>
  <text x="345" y="352" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">(UC-06)</text>

  <!-- Chat (UC-07) -->
  <ellipse cx="530" cy="340" rx="75" ry="30" fill="#aba3ff" stroke="transparent"/>
  <text x="530" y="336" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">Chat</text>
  <text x="530" y="352" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">(UC-07)</text>

  <!-- Join Game (UC-08) -->
  <ellipse cx="435" cy="430" rx="80" ry="30" fill="#aba3ff" stroke="transparent"/>
  <text x="435" y="426" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">Join Game</text>
  <text x="435" y="442" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1e">(UC-08)</text>

  <!-- Actor: Authenticated Player -->
  <ellipse cx="100" cy="200" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="215" x2="100" y2="266" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="224" x2="140" y2="224" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="305" x2="100" y2="266" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="305" x2="100" y2="266" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="330" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Authenticated</text>
  <text x="100" y="348" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Player</text>

  <!-- Player -> View Dashboard -->
  <line x1="140" y1="215" x2="320" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- extend: Dashboard to child use cases -->
  <line x1="395" y1="185" x2="355" y2="220" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="305" y="205" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="10" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <line x1="470" y1="185" x2="520" y2="220" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="510" y="205" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="10" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <line x1="395" y1="187" x2="350" y2="310" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="308" y="290" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="10" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <line x1="470" y1="187" x2="525" y2="310" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="510" y="290" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="10" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <line x1="435" y1="187" x2="435" y2="400" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="450" y="380" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="10" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

</svg>
