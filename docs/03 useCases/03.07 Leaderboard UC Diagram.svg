  <text x="350" y="66" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Leaderboard System</text>

  <ellipse cx="440" cy="160" rx="110" ry="45" fill="#aba3ff" stroke="transparent"/>
