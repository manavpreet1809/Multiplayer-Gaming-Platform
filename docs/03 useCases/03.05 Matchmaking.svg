<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="820" height="680" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary Box -->
  <rect x="250" y="30" width="380" height="620" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="250" y1="85" x2="630" y2="85" stroke="#2c2e33" stroke-width="2"/>
  <text x="350" y="66" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Matchmaking System</text>

  <!-- ============================================ -->
  <!-- USE CASE ELLIPSES (purple #aba3ff)           -->
  <!-- ============================================ -->

  <!-- MM-01: Join Queue -->
  <ellipse cx="440" cy="150" rx="115" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="440" y="145" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">MM-01: Join</text>
  <text x="440" y="163" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Queue</text>

  <!-- Validate Queue Eligibility -->
  <ellipse cx="440" cy="265" rx="110" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="440" y="260" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Validate Queue</text>
  <text x="440" y="278" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Eligibility</text>

  <!-- MM-02: View Queue Status -->
  <ellipse cx="440" cy="370" rx="115" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="440" y="365" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">MM-02: View</text>
  <text x="440" y="383" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Queue Status</text>

  <!-- MM-03: Leave Queue -->
  <ellipse cx="340" cy="470" rx="80" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="340" y="465" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">MM-03:</text>
  <text x="340" y="483" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Leave Queue</text>

  <!-- MM-04: Match Players -->
  <ellipse cx="540" cy="470" rx="80" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="540" y="465" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">MM-04:</text>
  <text x="540" y="483" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Match Players</text>

  <!-- MM-05: Notify Match Found -->
  <ellipse cx="540" cy="580" rx="80" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="540" y="575" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">MM-05: Notify</text>
  <text x="540" y="593" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Match Found</text>

  <!-- ============================================ -->
  <!-- ACTORS                                       -->
  <!-- ============================================ -->

  <!-- Authenticated Player (left side) -->
  <ellipse cx="100" cy="295" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="310" x2="100" y2="361" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="319" x2="140" y2="319" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="400" x2="100" y2="361" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="400" x2="100" y2="361" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="425" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Authenticated</text>
  <text x="100" y="443" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Player</text>

  <!-- Matchmaking Service (right side) -->
  <ellipse cx="740" cy="465" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="740" y1="480" x2="740" y2="531" stroke="#2c2e33" stroke-width="2"/>
  <line x1="700" y1="489" x2="780" y2="489" stroke="#2c2e33" stroke-width="2"/>
  <line x1="708" y1="570" x2="740" y2="531" stroke="#2c2e33" stroke-width="2"/>
  <line x1="772" y1="570" x2="740" y2="531" stroke="#2c2e33" stroke-width="2"/>
  <text x="740" y="595" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Matchmaking</text>
  <text x="740" y="613" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Service</text>

  <!-- ============================================ -->
  <!-- ASSOCIATION LINES (actor to use case)        -->
  <!-- ============================================ -->

  <!-- Player -> MM-01: Join Queue -->
  <line x1="140" y1="310" x2="325" y2="155" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Player -> MM-02: View Queue Status -->
  <line x1="140" y1="335" x2="325" y2="368" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Player -> MM-03: Leave Queue -->
  <line x1="140" y1="360" x2="260" y2="465" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Matchmaking Service -> MM-04: Match Players -->
  <line x1="700" y1="480" x2="620" y2="472" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Matchmaking Service -> MM-05: Notify Match Found -->
  <line x1="700" y1="505" x2="620" y2="575" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- <<include>> RELATIONSHIPS (dashed arrows)    -->
  <!-- ============================================ -->

  <!-- MM-01 --<<include>>--> Validate Queue Eligibility -->
  <line x1="440" y1="192" x2="440" y2="227" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="460" y="215" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- MM-04 --<<include>>--> MM-05 -->
  <line x1="540" y1="508" x2="540" y2="538" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="555" y="528" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- ============================================ -->
  <!-- <<extend>> RELATIONSHIP (dashed arrow)       -->
  <!-- ============================================ -->

  <!-- MM-03 --<<extend>>--> MM-01 -->
  <line x1="320" y1="432" x2="390" y2="195" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="310" y="310" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

</svg>
