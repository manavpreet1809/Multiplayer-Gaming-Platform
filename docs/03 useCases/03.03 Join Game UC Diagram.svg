<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="780" height="620" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&amp;display=swap');
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary Box -->
  <rect x="300" y="30" width="340" height="560" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="300" y1="85" x2="640" y2="85" stroke="#2c2e33" stroke-width="2"/>
  <text x="370" y="66" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">
    Join Game System
  </text>

  <!-- ============================================ -->
  <!-- USE CASE ELLIPSES (purple #aba3ff)           -->
  <!-- ============================================ -->

  <!-- UC: Receive Game Ready Notification (top) -->
  <ellipse cx="470" cy="150" rx="100" ry="45" fill="#aba3ff" stroke="transparent"/>
  <text x="470" y="145" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Receive Game</text>
  <text x="470" y="163" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Ready Notification</text>

  <!-- UC: Join Game (center, main) -->
  <ellipse cx="470" cy="280" rx="100" ry="45" fill="#aba3ff" stroke="transparent"/>
  <text x="470" y="285" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Join Game</text>

  <!-- UC: Verify Player Assignment -->
  <ellipse cx="470" cy="410" rx="100" ry="45" fill="#aba3ff" stroke="transparent"/>
  <text x="470" y="405" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Verify Player</text>
  <text x="470" y="423" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Assignment</text>

  <!-- UC: Connect to Game Session -->
  <ellipse cx="470" cy="530" rx="100" ry="45" fill="#aba3ff" stroke="transparent"/>
  <text x="470" y="525" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Connect to</text>
  <text x="470" y="543" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Game Session</text>

  <!-- ============================================ -->
  <!-- ACTORS (stick figures)                       -->
  <!-- ============================================ -->

  <!-- Authenticated Player (left side) -->
  <!-- Head -->
  <ellipse cx="120" cy="265" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <!-- Body -->
  <line x1="120" y1="280" x2="120" y2="331" stroke="#2c2e33" stroke-width="2"/>
  <!-- Arms -->
  <line x1="80" y1="289" x2="160" y2="289" stroke="#2c2e33" stroke-width="2"/>
  <!-- Left leg -->
  <line x1="88" y1="370" x2="120" y2="331" stroke="#2c2e33" stroke-width="2"/>
  <!-- Right leg -->
  <line x1="152" y1="370" x2="120" y2="331" stroke="#2c2e33" stroke-width="2"/>
  <!-- Label -->
  <text x="120" y="395" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Authenticated</text>
  <text x="120" y="413" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Player</text>

  <!-- Game Server (right side) -->
  <!-- Head -->
  <ellipse cx="730" cy="265" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <!-- Body -->
  <line x1="730" y1="280" x2="730" y2="331" stroke="#2c2e33" stroke-width="2"/>
  <!-- Arms -->
  <line x1="690" y1="289" x2="770" y2="289" stroke="#2c2e33" stroke-width="2"/>
  <!-- Left leg -->
  <line x1="698" y1="370" x2="730" y2="331" stroke="#2c2e33" stroke-width="2"/>
  <!-- Right leg -->
  <line x1="762" y1="370" x2="730" y2="331" stroke="#2c2e33" stroke-width="2"/>
  <!-- Label -->
  <text x="730" y="395" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Game Server</text>

  <!-- ============================================ -->
  <!-- ASSOCIATION LINES (actor to use case)        -->
  <!-- ============================================ -->

  <!-- Player → Receive Game Ready Notification -->
  <line x1="160" y1="280" x2="370" y2="155" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Player → Join Game -->
  <line x1="160" y1="295" x2="370" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Game Server → Verify Player Assignment -->
  <line x1="690" y1="300" x2="570" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Game Server → Connect to Game Session -->
  <line x1="690" y1="320" x2="570" y2="520" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- <<include>> RELATIONSHIPS (dashed arrows)    -->
  <!-- ============================================ -->

  <!-- Join Game --<<include>>--> Verify Player Assignment -->
  <line x1="470" y1="325" x2="470" y2="365" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="490" y="350" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">
    &lt;&lt;include&gt;&gt;
  </text>

  <!-- Join Game --<<include>>--> Connect to Game Session -->
  <line x1="445" y1="323" x2="430" y2="490" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="365" y="430" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">
    &lt;&lt;include&gt;&gt;
  </text>

  <!-- Receive Notification --<<extends>>--> Join Game -->
  <line x1="470" y1="195" x2="470" y2="235" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="490" y="220" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">
    &lt;&lt;extend&gt;&gt;
  </text>

</svg>
