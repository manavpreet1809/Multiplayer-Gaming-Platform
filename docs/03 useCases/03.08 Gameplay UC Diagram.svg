  <text x="330" y="230" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <line x1="500" y1="200" x2="530" y2="252" stroke="#000000" stroke-width="1.5"
