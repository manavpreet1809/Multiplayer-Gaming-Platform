  <ellipse cx="460" cy="535" rx="100" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="460" y="530" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Update Stats</text>
  <text x="460" y="548" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">and Leaderboard</text>

  <ellipse cx="110" cy="225" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
