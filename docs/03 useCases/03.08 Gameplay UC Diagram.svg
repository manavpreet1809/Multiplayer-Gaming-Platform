  <text x="730" y="443" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Server</text>

  <line x1="150" y1="245" x2="350" y2="165" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="280" x2="350" y2="415" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="310" x2="465" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="325" x2="635" y2="295" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="420" y1="200" x2="395" y2="252" stroke="#000000" stroke-width="1.5"
