  <text x="475" y="345" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <line x1="460" y1="465" x2="460" y2="497" stroke="#000000" stroke-width="1.5"
