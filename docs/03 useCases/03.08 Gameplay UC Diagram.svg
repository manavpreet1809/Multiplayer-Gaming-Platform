  <text x="530" y="230" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <line x1="460" y1="205" x2="460" y2="375" stroke="#000000" stroke-width="1.5"
