  <line x1="280" y1="85" x2="640" y2="85" stroke="#2c2e33" stroke-width="2"/>
  <text x="390" y="66" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Gameplay System</text>

  <ellipse cx="460" cy="160" rx="110" ry="45" fill="#aba3ff" stroke="transparent"/>
  <text x="460" y="155" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-13: Submit</text>
  <text x="460" y="173" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Move</text>

  <ellipse cx="380" cy="290" rx="85" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="380" y="285" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Validate</text>
  <text x="380" y="303" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Move</text>

  <ellipse cx="550" cy="290" rx="85" ry="38" fill="#aba3ff" stroke="transparent"/>
  <text x="550" y="285" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Check End</text>
  <text x="550" y="303" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Conditions</text>

  <ellipse cx="460" cy="420" rx="110" ry="45" fill="#aba3ff" stroke="transparent"/>
