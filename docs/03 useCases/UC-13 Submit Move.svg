@startuml
title UC-13: Submit Move (Updated)\nS-2: Timeout | S-3: Resign | C-4: EventBus
skinparam backgroundColor white

left to right direction
skinparam packageStyle rectangle

actor "Authenticated\nPlayer" as Player
actor "Game Server" as Server

rectangle "Platform" {
  usecase "UC-13: Submit\nMove" as UC13
  usecase "Validate Move" as VM
  usecase "Publish via\nEventBus" as PEB
  usecase "View Game\nResults (UC-14)" as UC14
  usecase "Resign" as RES
}

Player - -> UC13
Player - -> RES
Server - -> VM
Server - -> PEB

UC13 ..> VM : <<include>>
UC13 ..> PEB : <<include>>
UC13 ..> UC14 : <<extend>>
RES ..> UC14 : <<include>>
RES ..> PEB : <<include>>

note bottom of RES
  **NEW (S-3)**
  Available from YourTurn
  and WaitingForTurn
end note

note bottom of PEB
  **UPDATED (C-4)**
  All state changes
  route through EventBus
end note

@enduml

