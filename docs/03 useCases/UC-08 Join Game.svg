@startuml
title UC-08: Join Game (Updated)\nS-1: Added Reconnection Flow
skinparam backgroundColor white

left to right direction
skinparam packageStyle rectangle

actor "Authenticated\nPlayer" as Player
actor "Game Server" as Server

rectangle "Platform" {
  usecase "UC-08: Join Game" as UC08
  usecase "Verify Player\nAssignment" as VPA
  usecase "Connect to\nGame Session" as CGS
  usecase "Reconnect to\nGame Session" as RGS
}

Player - -> UC08
Server - -> VPA
Server - -> CGS
Server - -> RGS

UC08 ..> VPA : <<include>>
UC08 ..> CGS : <<include>>
UC08 ..> RGS : <<extend>>

note right of RGS
  **NEW (S-1)**
  - Check reconnect timeout
  - Restore previous state
  - Handle expired timeout
end note

@enduml

