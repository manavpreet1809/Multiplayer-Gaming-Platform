<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="720" height="450" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#000000"/>
    </marker>
    <style type="text/css">
      text { text-rendering: geometricprecision; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f2f2f2"/>

  <!-- System Boundary -->
  <rect x="260" y="30" width="320" height="390" rx="8" ry="8"
        fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="260" y1="80" x2="580" y2="80" stroke="#2c2e33" stroke-width="2"/>
  <text x="370" y="63" font-family="'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Platform</text>

  <!-- UC-08: Join Game -->
  <ellipse cx="420" cy="150" rx="100" ry="42" fill="#aba3ff" stroke="transparent"/>
  <text x="420" y="145" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">UC-08: Join</text>
  <text x="420" y="163" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">Game</text>

  <!-- Verify Player Assignment -->
  <ellipse cx="360" cy="275" rx="90" ry="35" fill="#aba3ff" stroke="transparent"/>
  <text x="360" y="270" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Verify Player</text>
  <text x="360" y="288" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Assignment</text>

  <!-- Connect to Game Session -->
  <ellipse cx="480" cy="370" rx="90" ry="35" fill="#aba3ff" stroke="transparent"/>
  <text x="480" y="365" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Connect to</text>
  <text x="480" y="383" text-anchor="middle" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1c1e">Game Session</text>

  <!-- Actor: Authenticated Player (left) -->
  <ellipse cx="100" cy="135" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="201" stroke="#2c2e33" stroke-width="2"/>
  <line x1="60" y1="159" x2="140" y2="159" stroke="#2c2e33" stroke-width="2"/>
  <line x1="68" y1="240" x2="100" y2="201" stroke="#2c2e33" stroke-width="2"/>
  <line x1="132" y1="240" x2="100" y2="201" stroke="#2c2e33" stroke-width="2"/>
  <text x="100" y="265" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Authenticated</text>
  <text x="100" y="283" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Player</text>

  <!-- Actor: Game Server (right) -->
  <ellipse cx="660" cy="270" rx="15" ry="15" fill="#ffffff" stroke="#2c2e33" stroke-width="2"/>
  <line x1="660" y1="285" x2="660" y2="336" stroke="#2c2e33" stroke-width="2"/>
  <line x1="620" y1="294" x2="700" y2="294" stroke="#2c2e33" stroke-width="2"/>
  <line x1="628" y1="375" x2="660" y2="336" stroke="#2c2e33" stroke-width="2"/>
  <line x1="692" y1="375" x2="660" y2="336" stroke="#2c2e33" stroke-width="2"/>
  <text x="660" y="398" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Game</text>
  <text x="660" y="416" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="14" fill="#2c2e33">Server</text>

  <!-- Player -> Join Game -->
  <line x1="140" y1="155" x2="320" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Game Server -> Verify Player Assignment -->
  <line x1="620" y1="285" x2="450" y2="275" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Game Server -> Connect to Game Session -->
  <line x1="620" y1="310" x2="570" y2="365" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- include: Join Game to Verify Player Assignment -->
  <line x1="390" y1="190" x2="370" y2="240" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="315" y="220" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- include: Join Game to Connect to Game Session -->
  <line x1="440" y1="192" x2="468" y2="335" stroke="#000000" stroke-width="1.5"
        stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="475" y="280" font-family="'Roobert', Helvetica, Arial, sans-serif" font-size="11" fill="#2c2e33" font-style="italic">&lt;&lt;include&gt;&gt;</text>

</svg>
